# NOTE: We intentionally do NOT use an `upstream {}` block here.
# nginx resolves upstream host names once at startup and caches the IP.
# When the `app` container is recreated on deploy it gets a new IP, leaving
# nginx pointing at a dead address (502 Connection refused). Instead we use
# Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass so nginx
# re-resolves `app` at runtime and self-heals after every deploy.

# HTTP → ACME + HTTPS redirect (both API hostnames)
server {
    listen 80;
    server_name api.quantumsocialclub.id api.blackpadel.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Quantum Social Club
server {
    listen 443 ssl;
    http2 on;
    server_name api.quantumsocialclub.id;

    ssl_certificate /etc/letsencrypt/live/api.quantumsocialclub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quantumsocialclub.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend app:8000;

    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/api_proxy_locations.inc;
}

# HTTPS — Black Padel
# Requires cert first:
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot certonly \
#     --webroot --webroot-path=/var/www/certbot -d api.blackpadel.id \
#     --email YOUR@EMAIL --agree-tos --no-eff-email
server {
    listen 443 ssl;
    http2 on;
    server_name api.blackpadel.id;

    ssl_certificate /etc/letsencrypt/live/api.blackpadel.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.blackpadel.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend app:8000;

    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/api_proxy_locations.inc;
}
